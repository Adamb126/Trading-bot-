name: XRP/EUR Trading Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot (single tick)
        env:
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
          TRADE_AMOUNT_EUR: ${{ vars.TRADE_AMOUNT_EUR || '100' }}
          DAILY_PROFIT_TARGET: ${{ vars.DAILY_PROFIT_TARGET || '0.10' }}
          DAILY_STOP_LOSS: ${{ vars.DAILY_STOP_LOSS || '0.075' }}
          DRY_RUN: "false"
        run: |
          python - << 'PYEOF'
          from bot import TradingBot
          bot = TradingBot()
          bot.tick()
          PYEOF

      - name: Commit dashboard data
        run: |
          git config user.name  "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git fetch origin main
          git stash
          git rebase origin/main
          git stash pop
          git add data/status.json
          git diff --cached --quiet || git commit -m "chore: update dashboard data [skip ci]"
          git push origin main

      - name: Schedule next run
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          sleep 270
          git config user.name  "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          git commit --allow-empty -m "chore: bot heartbeat"
          git remote set-url origin https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}.git
          git push origin main
