name: Stock Trading Bot

on:
  schedule:
    # Every 15 min during US market hours (covers EST & EDT), Mon–Fri.
    # 13:30–20:59 UTC. Bot self-checks is_market_open() and skips when closed.
    - cron: '*/15 13-20 * * 1-5'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot (single tick)
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_PAPER:      ${{ vars.ALPACA_PAPER || 'true' }}
          WATCHLIST:         ${{ vars.WATCHLIST || 'AAPL,MSFT,NVDA' }}
          TRADE_AMOUNT_USD:  ${{ vars.TRADE_AMOUNT_USD || '100' }}
          DAILY_PROFIT_TARGET: ${{ vars.DAILY_PROFIT_TARGET || '0.10' }}
          DAILY_STOP_LOSS:     ${{ vars.DAILY_STOP_LOSS || '0.075' }}
          DRY_RUN: "false"
        run: |
          python - << 'PYEOF'
          from bot import TradingBot
          TradingBot().tick()
          PYEOF

      - name: Commit dashboard data
        run: |
          git config user.name  "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git fetch origin main
          cp data/status.json /tmp/status_new.json
          git reset --hard origin/main
          cp /tmp/status_new.json data/status.json
          git add data/status.json
          git diff --cached --quiet || git commit -m "chore: update dashboard data"
          git push origin main
